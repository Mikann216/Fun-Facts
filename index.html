  for (let i = a.length - 1; i > 0; i--) {

// ============================================================
//  PARSER & VALIDATOR for the host's pasted sheet rows
// ============================================================
// Input: tab-separated rows (columns B-F from Google Sheets).
// Each row: Fact \t Author \t Decoy1 \t Decoy2 \t Decoy3
function parseSheetRows(raw) {
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) {
    throw new Error("No rows found. Paste rows from your Google Sheet (columns B-F).");
  }

  const rows = [];
  for (let i = 0; i < lines.length; i++) {
    const cols = lines[i].split("\t").map(c => c.trim());
    if (cols.length < 5) {
      throw new Error(`Row ${i + 1}: expected 5 tab-separated columns (Fact, Author, Decoy1, Decoy2, Decoy3), got ${cols.length}. Did you copy from Google Sheets with tabs?`);
    }
    if (cols.length > 5) {
      throw new Error(`Row ${i + 1}: too many columns (${cols.length}). Make sure you only selected columns B-F.`);
    }
    const [fact, author, d1, d2, d3] = cols;
    if (!fact)   throw new Error(`Row ${i + 1}: fact is empty.`);
    if (!author) throw new Error(`Row ${i + 1}: author is empty.`);
    if (!d1)     throw new Error(`Row ${i + 1}: decoy 1 is empty.`);
    if (!d2)     throw new Error(`Row ${i + 1}: decoy 2 is empty.`);
    if (!d3)     throw new Error(`Row ${i + 1}: decoy 3 is empty.`);

    const allFour = [author, d1, d2, d3];
    const dupes = allFour.filter((n, idx) => allFour.indexOf(n) !== idx);
    if (dupes.length > 0) {
      throw new Error(`Row ${i + 1}: duplicate name "${dupes[0]}" among the 4 candidate names. All 4 must be different.`);
    }
    rows.push({ fact, author, candidates: allFour });
  }
  return rows;
}

function parseMatchingRowNumbers(raw, totalRows) {
  const nums = raw.split(/[,\s]+/)
    .map(s => s.trim())
    .filter(s => s.length > 0)
    .map(s => parseInt(s, 10));
  if (nums.length !== 4) {
    throw new Error(`Matching round needs exactly 4 row numbers, got ${nums.length}.`);
  }
  for (const n of nums) {
    if (isNaN(n)) throw new Error(`Matching round: not a valid number.`);
    if (n < 1 || n > totalRows) {
      throw new Error(`Matching round: row ${n} is out of range (1-${totalRows}).`);
    }
  }
  if (new Set(nums).size !== 4) {
    throw new Error(`Matching round: row numbers must be unique.`);
  }
  return nums;
}

function parsePermutation(raw, expectedNames, label) {
  const names = raw.split(",").map(s => s.trim()).filter(s => s.length > 0);
  if (names.length !== 4) {
    throw new Error(`${label}: expected 4 comma-separated names, got ${names.length}.`);
  }
  const expectedSet = new Set(expectedNames);
  for (const n of names) {
    if (!expectedSet.has(n)) {
      throw new Error(`${label}: "${n}" is not one of the matching round authors (${expectedNames.join(", ")}).`);
    }
  }
  if (new Set(names).size !== 4) {
    throw new Error(`${label}: names must be unique (it's a permutation).`);
  }
  return names;
}

function buildGamePlan(sheetRaw, matchingRowsRaw, perm1Raw, perm2Raw, perm3Raw) {
  const allRows = parseSheetRows(sheetRaw);
  if (allRows.length < 5) {
    throw new Error(`Need at least 5 rows total (4 for matching round + 1 single round). Got ${allRows.length}.`);
  }
  const matchingIdxs = parseMatchingRowNumbers(matchingRowsRaw, allRows.length).map(n => n - 1);

  const matchingRows = matchingIdxs.map(i => allRows[i]);
  const matchingAuthors = matchingRows.map(r => r.author);
  const dupAuthors = matchingAuthors.filter((n, i) => matchingAuthors.indexOf(n) !== i);
  if (dupAuthors.length > 0) {
    throw new Error(`Matching round authors must be unique (found duplicate "${dupAuthors[0]}").`);
  }

  const correctPerm = matchingAuthors.slice();
  const wrongPerms = [
    parsePermutation(perm1Raw, matchingAuthors, "Wrong permutation 1"),
    parsePermutation(perm2Raw, matchingAuthors, "Wrong permutation 2"),
    parsePermutation(perm3Raw, matchingAuthors, "Wrong permutation 3")
  ];
  for (let i = 0; i < wrongPerms.length; i++) {
    if (wrongPerms[i].every((n, j) => n === correctPerm[j])) {
      throw new Error(`Wrong permutation ${i + 1} matches the correct order. It must differ.`);
    }
  }
  const allPerms = [correctPerm, ...wrongPerms];
  const allPermsKeys = allPerms.map(p => p.join("|"));
  for (let i = 0; i < allPermsKeys.length; i++) {
    for (let j = i + 1; j < allPermsKeys.length; j++) {
      if (allPermsKeys[i] === allPermsKeys[j]) {
        throw new Error(`Permutations ${i === 0 ? "(correct)" : i} and ${j} are identical. All 4 must differ.`);
      }
    }
  }

  // Shuffle the 4 permutations and remember the correct index
  const tagged = allPerms.map((p, i) => ({ p, originalIdx: i }));
  const shuffled = shuffleArray(tagged);
  const matchingOptions = shuffled.map(s => s.p);
  const matchingCorrectIndex = shuffled.findIndex(s => s.originalIdx === 0);

  // Single rounds = all rows NOT in matchingIdxs, in pasted order
  const matchingSet = new Set(matchingIdxs);
  const singleRows = allRows
    .map((r, i) => ({ r, i }))
    .filter(x => !matchingSet.has(x.i))
    .map(x => x.r);

  const plan = [];
  let roundNum = 1;
  for (const sr of singleRows) {
    plan.push({
      round_number: roundNum++,
      round_type: "single",
      fact: sr.fact,
      correct_name: sr.author,
      candidate_names: shuffleArray(sr.candidates),
      is_walkin: false
    });
  }
  // Matching round goes last
  plan.push({
    round_number: roundNum++,
    round_type: "matching",
    matching_facts: matchingRows.map(r => ({ fact: r.fact, correct_name: r.author })),
    matching_options: matchingOptions,
    matching_correct_index: matchingCorrectIndex,
    is_walkin: false
  });
  return plan;
}

    round_number: p.round_number,
    round_type: p.round_type,
    fact: p.fact ?? null,
    correct_name: p.correct_name ?? null,

    matching_options: p.matching_options ?? null,
    matching_correct_index: p.matching_correct_index ?? null,
    is_walkin: p.is_walkin ?? false
  }));
  await sbInsert("rounds", rows);
}

// Get all votes cast so far for the current round
async function loadVotesForCurrentRound() {
  if (!room || !room.current_round_number) return [];
  return await sbSelect("votes",
    `select=*&room_code=eq.${roomCode}&round_number=eq.${room.current_round_number}`);
}

// Player submits a vote for a single-fact round.
// `choice` is the chosen name string. Vote is immutable once submitted.
async function submitSingleVote(choice) {
  const myId = localStorage.getItem(`playerId_${roomCode}`);
  if (!myId) throw new Error("Not joined as a player.");
  const cur = getCurrentRound();
  if (!cur) throw new Error("No current round.");
  if (cur.round_type !== "single") throw new Error("This isn't a single-fact round.");
  if (room.round_phase !== "voting") throw new Error("Voting is closed for this round.");

  const isCorrect = (choice === cur.correct_name);
  await sbInsert("votes", {
    room_code: roomCode,
    round_number: cur.round_number,
    player_id: myId,
    choice: choice,
    is_correct: isCorrect
  });
}

// Host reveals the current round (transitions voting -> revealing).
async function revealCurrentRound() {
  await sbUpdate("rooms", `room_code=eq.${roomCode}`, { round_phase: "revealing" });
  lastRenderKey = "";
  await refresh();
}

// Host advances to the next round (or finishes the game if last round).
async function advanceToNextRound() {
  const cur = getCurrentRound();
  if (!cur) return;
  const nextNum = cur.round_number + 1;
  const hasNext = rounds.some(r => r.round_number === nextNum);
  if (!hasNext) {
    // No more rounds — game finished
    await sbUpdate("rooms", `room_code=eq.${roomCode}`, {
      phase: "finished", round_phase: "voting"
    });
  } else {
    await sbUpdate("rooms", `room_code=eq.${roomCode}`, {
      current_round_number: nextNum, round_phase: "voting"
    });
  }
  lastRenderKey = "";
  await refresh();
}

function onValidate() {
  const feedback = document.getElementById("builder-feedback");
  feedback.innerHTML = "";
  const sheetRaw = document.getElementById("sheet-input").value;
  const matchingRowsRaw = document.getElementById("matching-rows-input").value;
  const perm1Raw = document.getElementById("perm1-input").value;
  const perm2Raw = document.getElementById("perm2-input").value;
  const perm3Raw = document.getElementById("perm3-input").value;

  let plan;
  try {
    plan = buildGamePlan(sheetRaw, matchingRowsRaw, perm1Raw, perm2Raw, perm3Raw);
  } catch (err) {
    feedback.innerHTML = `<div class="error-box">⚠️ ${escapeHtml(err.message)}</div>`;
    return;
  }

  const previewHtml = plan.map(p => {
    if (p.round_type === "single") {
      return `
        <div class="preview-round">
          <div class="preview-round-num">Round ${p.round_number}</div>
          <div class="preview-fact">"${escapeHtml(p.fact)}"</div>
          <div class="preview-names">
            Names: ${p.candidate_names.map(n =>
              n === p.correct_name
                ? `<span class="preview-correct">${escapeHtml(n)} ✓</span>`
                : escapeHtml(n)
            ).join(" · ")}
          </div>
        </div>
      `;
    } else {
      const optsHtml = p.matching_options.map((opt, i) =>
        `<div style="margin:4px 0;">
          ${i === p.matching_correct_index ? "<span class='preview-correct'>✓</span> " : "&nbsp;&nbsp;"}
          Option ${i + 1}: ${opt.map(escapeHtml).join(" / ")}
        </div>`
      ).join("");
      const factsHtml = p.matching_facts.map(f =>
        `<div style="margin:2px 0;"><em>"${escapeHtml(f.fact)}"</em> → <strong>${escapeHtml(f.correct_name)}</strong></div>`
      ).join("");
      return `
        <div class="preview-round">
          <div class="preview-round-num">Round ${p.round_number} <span class="matching-badge">MATCHING</span></div>
          ${factsHtml}
          <div style="margin-top:6px;">${optsHtml}</div>
        </div>
      `;
    }
  }).join("");

  feedback.innerHTML = `
    <div class="success-box">✅ Looks good! ${plan.length} rounds parsed. Review the preview below before locking.</div>
    <div style="margin-top:12px;">${previewHtml}</div>
    <div class="btn-row">
      <button class="btn-primary" id="save-lock-btn">🔒 Save & Lock (open lobby)</button>
    </div>
  `;

  document.getElementById("save-lock-btn").addEventListener("click", async (e) => {
    lockButton(e.target);
    try {
      await saveGamePlan(plan);
      await lockAndStartLobby();
    } catch (err) {
      feedback.innerHTML += `<div class="error-box">⚠️ Save failed: ${escapeHtml(err.message)}</div>`;
    }
  });
}

function renderHostVotingSingle(cur) {
  const totalRounds = rounds.length;
  const totalPlayers = players.length;
  const tilesHtml = cur.candidate_names.map(n =>
    `<div class="name-tile">${escapeHtml(n)}</div>`
  ).join("");

  // We need vote count — fetch it asynchronously and update once we have it.
  app.innerHTML = `
    <div class="round-header">ROUND ${cur.round_number} / ${totalRounds}</div>
    <div class="fact-display">"${escapeHtml(cur.fact)}"</div>
    <div class="name-grid">${tilesHtml}</div>
    <div class="vote-counter" id="vote-counter">Loading votes...</div>
    <div class="btn-row">
      <button class="btn-white" id="reveal-btn">➡️ Reveal</button>
    </div>
    <br/>
    <button class="toggle-link" id="reset-link">Reset this room</button>
  `;

  document.getElementById("reveal-btn").addEventListener("click", async (e) => {
    lockButton(e.target);
    await revealCurrentRound();
  });
  document.getElementById("reset-link").addEventListener("click", fullReset);

  // Async update of vote counter
  loadVotesForCurrentRound().then(votes => {
    const el = document.getElementById("vote-counter");
    if (el) el.textContent = `${votes.length} / ${totalPlayers} voted`;
  }).catch(() => {});
}

async function renderHostRevealingSingle(cur) {
  const totalRounds = rounds.length;
  const votes = await loadVotesForCurrentRound();

  // Tally votes per candidate name
  const tally = {};
  for (const n of cur.candidate_names) tally[n] = 0;
  for (const v of votes) {
    if (tally.hasOwnProperty(v.choice)) tally[v.choice]++;
  }

  // 2x2 name grid with correct one highlighted
  const tilesHtml = cur.candidate_names.map(n => {
    const cls = (n === cur.correct_name) ? "name-tile correct" : "name-tile";
    return `<div class="${cls}">${escapeHtml(n)}</div>`;
  }).join("");

  // Vertical bar chart, scaled to max vote count
  const maxVotes = Math.max(1, ...Object.values(tally));
  const barsHtml = cur.candidate_names.map(n => {
    const count = tally[n] || 0;
    const heightPct = Math.round((count / maxVotes) * 100);
    const isCorrect = (n === cur.correct_name);
    const fillCls = isCorrect ? "bar-fill correct" : "bar-fill";
    const labelCls = isCorrect ? "bar-label correct" : "bar-label";
    return `
      <div class="bar-col">
        <div class="bar-count">${count}</div>
        <div class="${fillCls}" style="height: ${heightPct}%;"></div>
        <div class="${labelCls}">${escapeHtml(n)}</div>
      </div>
    `;
  }).join("");

  const isLastRound = !rounds.some(r => r.round_number === cur.round_number + 1);
  const nextLabel = isLastRound ? "🏁 Finish Game" : "➡️ Next Round";

  app.innerHTML = `
    <div class="round-header">ROUND ${cur.round_number} / ${totalRounds}</div>
    <div class="fact-display">"${escapeHtml(cur.fact)}"</div>
    <div class="name-grid">${tilesHtml}</div>
    <div class="bar-chart">${barsHtml}</div>
    <div class="btn-row">
      <button class="btn-white" id="next-btn">${nextLabel}</button>
    </div>
    <br/>
    <button class="toggle-link" id="reset-link">Reset this room</button>
  `;

  document.getElementById("next-btn").addEventListener("click", async (e) => {
    lockButton(e.target);
    await advanceToNextRound();
  });
  document.getElementById("reset-link").addEventListener("click", fullReset);
}

// ============================================================
function renderHost() {
  if (!roomCode || !room) { app.innerHTML = `<p>Loading...</p>`; return; }

  // Use a render key to avoid re-rendering on every poll if nothing changed.
  // The builder is excluded from the render key check because it manages its
  // own DOM (we don't want to clobber the user's typing on every poll).
  if (room.phase === "building") {
    renderBuilder();
    return;
  }

  const key = JSON.stringify({
    phase: room.phase,
    current: room.current_round_number,
    roundPhase: room.round_phase,
    walkins: room.walkin_count,
    players: players.map(p => p.id + ":" + p.name).join("|"),
    roundCount: rounds.length
  });
  if (key === lastRenderKey) return;
  lastRenderKey = key;
  builderRendered = false; // builder will need to re-mount if we ever go back

  if (room.phase === "lobby")    return renderHostLobby();
  if (room.phase === "playing")  return renderHostPlaying();
  if (room.phase === "finished") return renderHostFinishedPlaceholder();

  app.innerHTML = `<p>Unknown phase: ${escapeHtml(room.phase)}</p>`;
}

async function renderPlayerPlaying() {
  const cur = getCurrentRound();
  if (!cur) {
    app.innerHTML = `<h1>⏳ Waiting for next round...</h1>`;
    return;
  }

  // Phase 4 placeholder for matching rounds
  if (cur.round_type === "matching") {
    app.innerHTML = `
      <h1>🧩 Matching Round</h1>
      <p>Voting UI coming in Phase 4.<br/>Look at the host's screen 👀</p>
    `;
    return;
  }

  // Per Q3=B, players see "look at host screen" during revealing
  if (room.round_phase === "revealing") {
    app.innerHTML = `
      <h1>🎬 Round ${cur.round_number} reveal</h1>
      <p>Look at the host's screen 👀</p>
    `;
    return;
  }

  // Voting phase — check if this player has already voted
  const myId = localStorage.getItem(`playerId_${roomCode}`);
  if (!myId) {
    // Edge case: somehow lost player_id mid-game; treat as join again
    playerJoinRendered = false;
    renderPlayerJoin();
    return;
  }

  const myVotes = await sbSelect("votes",
    `select=*&room_code=eq.${roomCode}&round_number=eq.${cur.round_number}&player_id=eq.${myId}`);
  const myVote = myVotes[0];

  if (myVote) {
    // Already voted — show "locked in" screen
    app.innerHTML = `
      <div class="round-header">ROUND ${cur.round_number} / ${rounds.length}</div>
      <div class="fact-display">"${escapeHtml(cur.fact)}"</div>
      <div class="vote-locked">
        <h2>✅ Locked in!</h2>
        <div class="my-pick">You picked: ${escapeHtml(myVote.choice)}</div>
        <p style="color:#6b7280; margin:0;">Waiting for others to vote...</p>
      </div>
    `;
    return;
  }

  // Hasn't voted yet — show 4 tappable name buttons
  const tilesHtml = cur.candidate_names.map(n =>
    `<button class="name-tile" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`
  ).join("");

  app.innerHTML = `
    <div class="round-header">ROUND ${cur.round_number} / ${rounds.length}</div>
    <div class="fact-display">"${escapeHtml(cur.fact)}"</div>
    <div class="name-grid" id="vote-grid">${tilesHtml}</div>
    <p style="font-size:0.9rem; opacity:0.85; margin-top:8px;">Tap your guess. Once locked in, you can't change it.</p>
  `;

  document.querySelectorAll("#vote-grid button").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const choice = btn.getAttribute("data-name");
      // Disable all buttons immediately to prevent double-click / double-vote
      document.querySelectorAll("#vote-grid button").forEach(b => b.disabled = true);
      try {
        await submitSingleVote(choice);
        await refresh();
      } catch (err) {
        // Re-enable on error
        document.querySelectorAll("#vote-grid button").forEach(b => b.disabled = false);
        alert("Oops: " + err.message);
      }
    });
  });
}

function renderPlayer() {
  if (!roomCode) { renderPlayerNoRoom(); return; }
  if (!room)     { renderPlayerNoRoom(); return; }

  // Validate any saved player_id against the DB (host may have reset)
  const idKey = `playerId_${roomCode}`;
  const savedId = localStorage.getItem(idKey);
  if (savedId) {
    const stillExists = players.some(p => p.id === savedId);
    if (!stillExists) {
      // Host reset the room — clear stale localStorage silently
      localStorage.removeItem(idKey);
      localStorage.removeItem(`playerName_${roomCode}`);
      playerJoinRendered = false;
    }
  }

  const myId = localStorage.getItem(idKey);
  const hasJoined = !!myId;

  if (room.phase === "building") {
    renderPlayerBuilding();
    return;
  }
  if (room.phase === "lobby") {
    if (!hasJoined) { renderPlayerJoin(); return; }
    renderPlayerLobby();
    return;
  }
  if (room.phase === "playing") {
    if (!hasJoined) {
      // Late joiners get the join screen; scoring starts from their first vote.
      renderPlayerJoin();
      return;
    }
    renderPlayerPlaying();
    return;
  }
  if (room.phase === "finished") {
    renderPlayerFinishedPlaceholder();
    return;
  }

  app.innerHTML = `<p>Unknown phase: ${escapeHtml(room.phase)}</p>`;
}

// ============================================================
//  MAIN REFRESH LOOP
// ============================================================
async function refresh() {
  try {
    if (isHost) {
      if (!roomCode || !localStorage.getItem("hostRoomCode") || localStorage.getItem("hostRoomCode") !== roomCode) {
        await ensureHostRoom();
      }
    }
    await Promise.all([loadRoom(), loadPlayers(), loadRounds()]);
    if (isHost) renderHost();
    else if (isPlayer) renderPlayer();
    else renderLanding();
  } catch (err) {
    app.innerHTML = `<div class="card" style="color:#b91c1c;"><h2>⚠️ Error</h2><p>${escapeHtml(err.message)}</p><p style="font-size:0.9rem;">Check that your SUPABASE_URL and SUPABASE_KEY are filled in correctly, and that the database migration ran successfully.</p></div>`;
  }
}

// ============================================================
//  BOOT
// ============================================================
(async () => {
  if (isHost) {
    await ensureHostRoom();
    await refresh();
    startPolling(2000); // host polls every 2s
  } else if (isPlayer) {
    await refresh();
    if (roomCode) startPolling(5000); // player polls every 5s
  } else {
    renderLanding();
  }
})();
</script>
